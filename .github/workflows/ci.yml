name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: uv sync --extra dev
      - run: uv run ruff check .
      - run: uv run pytest --cov=aura_runtime --cov-report=term-missing
      - name: Trace contract positive control
        run: uv run python examples/reference_agent/demo.py --output .aura-ci
      - name: Publish canonical demo summary
        run: |
          cat .aura-ci/safe.md >> "$GITHUB_STEP_SUMMARY"
          cat .aura-ci/dangerous.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload Aura evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aura-trace-contract-reports
          path: .aura-ci/
      - run: uv build
