version: "0.1"
policies:
  - id: destructive-tools-require-approval
    description: Customer deletion requires explicit approval.
    severity: critical
    effect: require_approval
    on:
      event: tool.call.requested
      tool_matches: [delete_customer]
    require_prior:
      event: human.approval
      within_events: 20
      where:
        data.approved: true

  - id: refund-limit
    description: Automated refunds must not exceed 500.
    severity: high
    on:
      event: tool.call.requested
      tool_matches: [refund_order]
    constraints:
      - path: data.arguments.amount
        op: "<="
        value: 500

