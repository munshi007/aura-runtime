version: "0.1"
policies:
  - id: destructive-tools-require-approval
    description: A destructive tool call must be preceded by explicit human approval.
    severity: critical
    on:
      event: tool.call.requested
      tool_matches: ["delete_*", "drop_*"]
    require_prior:
      event: human.approval
      within_events: 20
      where:
        data.approved: true

  - id: transfer-limit
    description: Automated transfers must not exceed the configured limit.
    severity: high
    on:
      event: tool.call.requested
      tool_matches: ["transfer_funds"]
    constraints:
      - path: data.arguments.amount
        op: "<="
        value: 10000
        message: Transfer amount exceeds the automated execution limit.

